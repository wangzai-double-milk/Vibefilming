<svg width="1650" height="930" viewBox="0 0 1650 930" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 34px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #102a43; }
      .subtitle { font: 500 18px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #486581; }
      .box-title { font: 700 22px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #102a43; }
      .box-text { font: 500 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .section { font: 700 24px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #102a43; }
      .badge { font: 700 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .note { font: 700 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0b7285; }
      .arrowBlue { stroke: #2f6bff; stroke-width: 5; fill: none; marker-end: url(#arrowBlue); }
      .arrowOrange { stroke: #f08c00; stroke-width: 5; fill: none; marker-end: url(#arrowOrange); }
      .arrowPurple { stroke: #7c3aed; stroke-width: 5; fill: none; marker-end: url(#arrowPurple); }
      .arrowGreen { stroke: #16a34a; stroke-width: 5; fill: none; marker-end: url(#arrowGreen); }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#7b8794" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f6bff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#f08c00"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1650" height="930" fill="#f9fbff"/>
  <text x="825" y="58" text-anchor="middle" class="title">动态调度与并行生成策略</text>
  <text x="825" y="92" text-anchor="middle" class="subtitle">系统根据分镜依赖关系在“并行效率”与“镜头连贯性”之间进行自适应权衡</text>

  <rect x="100" y="150" rx="26" ry="26" width="250" height="105" fill="#eaf2ff" stroke="#a9c5ff" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="225" y="192" text-anchor="middle" class="box-title">输入故事需求</text>
  <text x="225" y="220" text-anchor="middle" class="box-text">生成脚本与分镜表</text>

  <rect x="420" y="150" rx="26" ry="26" width="280" height="105" fill="#eefaf6" stroke="#97dec1" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="560" y="192" text-anchor="middle" class="box-title">分析镜头依赖关系</text>
  <text x="560" y="220" text-anchor="middle" class="box-text">判断镜头之间是否相互独立</text>

  <polygon points="875,140 990,225 875,310 760,225" fill="#ffffff" stroke="#2d3748" stroke-width="3" filter="url(#shadow)"/>
  <text x="875" y="212" text-anchor="middle" class="box-title">镜头是否可</text>
  <text x="875" y="242" text-anchor="middle" class="box-title">并行生成？</text>

  <path class="arrowBlue" d="M350 202 L420 202"/>
  <path class="arrowBlue" d="M700 202 L760 202"/>

  <rect x="150" y="390" rx="28" ry="28" width="620" height="360" fill="#eef8ff" stroke="#8fc5ff" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="175" y="412" rx="16" ry="16" width="165" height="40" fill="#2f6bff"/>
  <text x="257" y="439" text-anchor="middle" class="badge">并行分支</text>
  <text x="460" y="438" text-anchor="middle" class="section">适用于广告、MV、分镜相对独立的短片</text>

  <rect x="210" y="490" rx="22" ry="22" width="145" height="90" fill="#ffffff" stroke="#bcdcff" stroke-width="2"/>
  <text x="282" y="528" text-anchor="middle" class="box-title">镜头 A</text>
  <text x="282" y="555" text-anchor="middle" class="box-text">并行生成</text>

  <rect x="388" y="490" rx="22" ry="22" width="145" height="90" fill="#ffffff" stroke="#bcdcff" stroke-width="2"/>
  <text x="460" y="528" text-anchor="middle" class="box-title">镜头 B</text>
  <text x="460" y="555" text-anchor="middle" class="box-text">并行生成</text>

  <rect x="566" y="490" rx="22" ry="22" width="145" height="90" fill="#ffffff" stroke="#bcdcff" stroke-width="2"/>
  <text x="638" y="528" text-anchor="middle" class="box-title">镜头 C</text>
  <text x="638" y="555" text-anchor="middle" class="box-text">并行生成</text>

  <rect x="210" y="620" rx="20" ry="20" width="145" height="80" fill="#f3f0ff" stroke="#cdb3ff" stroke-width="2"/>
  <text x="282" y="653" text-anchor="middle" class="box-title">镜头 A 审片</text>
  <text x="282" y="677" text-anchor="middle" class="box-text">并行质检</text>

  <rect x="388" y="620" rx="20" ry="20" width="145" height="80" fill="#f3f0ff" stroke="#cdb3ff" stroke-width="2"/>
  <text x="460" y="653" text-anchor="middle" class="box-title">镜头 B 审片</text>
  <text x="460" y="677" text-anchor="middle" class="box-text">并行质检</text>

  <rect x="566" y="620" rx="20" ry="20" width="145" height="80" fill="#f3f0ff" stroke="#cdb3ff" stroke-width="2"/>
  <text x="638" y="653" text-anchor="middle" class="box-title">镜头 C 审片</text>
  <text x="638" y="677" text-anchor="middle" class="box-text">并行质检</text>

  <path class="arrowBlue" d="M282 580 L282 620"/>
  <path class="arrowBlue" d="M460 580 L460 620"/>
  <path class="arrowBlue" d="M638 580 L638 620"/>

  <text x="230" y="730" class="note">优势：减少等待时间，提升吞吐效率</text>
  <text x="230" y="758" class="box-text">当镜头相互独立时，系统不会被固定串行流程束缚</text>

  <rect x="890" y="390" rx="28" ry="28" width="610" height="360" fill="#fff7ec" stroke="#f4c57d" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="915" y="412" rx="16" ry="16" width="165" height="40" fill="#f08c00"/>
  <text x="997" y="439" text-anchor="middle" class="badge">串行分支</text>
  <text x="1205" y="438" text-anchor="middle" class="section">适用于武打、追逐、长动作连续镜头</text>

  <rect x="955" y="500" rx="22" ry="22" width="145" height="90" fill="#ffffff" stroke="#f8d69e" stroke-width="2"/>
  <text x="1027" y="538" text-anchor="middle" class="box-title">镜头 1</text>
  <text x="1027" y="565" text-anchor="middle" class="box-text">生成并审片</text>

  <rect x="1130" y="500" rx="22" ry="22" width="145" height="90" fill="#ffffff" stroke="#f8d69e" stroke-width="2"/>
  <text x="1202" y="538" text-anchor="middle" class="box-title">镜头 2</text>
  <text x="1202" y="565" text-anchor="middle" class="box-text">承接上一镜头</text>

  <rect x="1305" y="500" rx="22" ry="22" width="145" height="90" fill="#ffffff" stroke="#f8d69e" stroke-width="2"/>
  <text x="1377" y="538" text-anchor="middle" class="box-title">镜头 3</text>
  <text x="1377" y="565" text-anchor="middle" class="box-text">保持动作连续</text>

  <path class="arrowOrange" d="M1100 545 L1130 545"/>
  <path class="arrowOrange" d="M1275 545 L1305 545"/>

  <rect x="1000" y="635" rx="20" ry="20" width="400" height="70" fill="#fff0f6" stroke="#ffb3d1" stroke-width="2"/>
  <text x="1200" y="678" text-anchor="middle" class="box-title">仅在必要时使用串行，优先保证叙事连续性与角色一致性</text>

  <text x="955" y="730" class="note">优势：避免角色漂移、动作断裂、情节跳变</text>
  <text x="955" y="758" class="box-text">当上下镜头存在强依赖时，系统自动转入链式承接策略</text>

  <rect x="560" y="810" rx="28" ry="28" width="520" height="70" fill="#e8fff0" stroke="#91d8aa" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="820" y="852" text-anchor="middle" class="box-title">统一合成输出：在效率与质量之间实现自适应平衡</text>

  <path class="arrowBlue" d="M805 275 C690 325 580 340 470 390"/>
  <text x="650" y="325" class="box-text">是</text>
  <path class="arrowOrange" d="M945 275 C1045 325 1140 340 1210 390"/>
  <text x="1010" y="325" class="box-text">否</text>

  <path class="arrowGreen" d="M638 700 C638 760 700 760 780 810"/>
  <path class="arrowGreen" d="M1200 705 C1200 760 1080 760 940 810"/>

  <text x="825" y="908" text-anchor="middle" class="subtitle">图 4  VibeFilming 的动态调度机制：根据镜头依赖性自适应选择并行或串行策略，以兼顾效率与连贯性</text>
</svg>
